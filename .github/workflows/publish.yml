name: Publish to crates.io

# Tag-driven release: push a tag matching the workspace version
# (e.g. `git tag v0.1.1 && git push origin v0.1.1`) and this workflow
# gates on the full test suite, publishes qrkit then qrkit-cli, and opens
# a GitHub Release. Requires the CARGO_REGISTRY_TOKEN repo secret
# (crates.io API token with the "publish-new" and "publish-update" scopes).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Refuse tags that don't match the crate version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="qrkit") | .version')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match qrkit version $VERSION — bump the workspace version first" >&2
            exit 1
          fi

      - name: Gates (fmt, clippy, full test suite)
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked

      - name: Publish qrkit
        # Idempotent on re-runs: a partially-failed workflow can be rerun
        # after qrkit already landed without this step failing. (The
        # `if out=$(…)` form keeps a failing publish from tripping errexit
        # before we can classify the error.)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if out=$(cargo publish -p qrkit --locked 2>&1); then
            exit 0
          elif echo "$out" | grep -qiE "already (exists|uploaded)"; then
            echo "qrkit $GITHUB_REF_NAME already on crates.io — continuing"
            exit 0
          else
            echo "$out" >&2
            exit 1
          fi

      - name: Publish qrkit-cli (retries while the sparse index propagates)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for attempt in $(seq 1 10); do
            if out=$(cargo publish -p qrkit-cli --locked 2>&1); then
              exit 0
            elif echo "$out" | grep -qiE "already (exists|uploaded)"; then
              echo "qrkit-cli already on crates.io — done"
              exit 0
            fi
            echo "attempt $attempt failed (qrkit likely not visible in the index yet); waiting 15s"
            sleep 15
          done
          echo "::error::qrkit-cli publish failed after 10 attempts" >&2
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
