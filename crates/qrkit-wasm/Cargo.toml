[package]
name = "qrkit-wasm"
description = "WebAssembly binding for qrkit (consumed via wasm-pack, not crates.io)"
version.workspace = true
edition.workspace = true
license.workspace = true
# Consumed through wasm-pack / the web app's pkg output, not cargo from
# crates.io — keep it out of the registry.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qrkit = { path = "../qrkit" }
wasm-bindgen.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
# default-features off: the `img` feature would pull the heavyweight image
# crate into the wasm bundle; we feed grayscale pixels directly.
rqrr = { workspace = true, default-features = false }

[dev-dependencies]
base64.workspace = true
png.workspace = true
