<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>qrkit — vector QR generator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%23ffffff'/%3E%3Cpath d='M1 1h2v2H1zM5 1h2v2H5zM1 5h2v2H1zM5 5h1v1H5z' fill='%230d47a1'/%3E%3C/svg%3E"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<header>
  <nav style="display:flex;gap:1.2rem;align-items:baseline">
    <h1 style="margin:0">qrkit</h1>
    <a href="docs.html" style="color:inherit">docs</a>
  </nav>
  <p style="margin:0.2rem 0 0">Customizable QR codes as true vector graphics</p>
</header>
<main>
  <section id="panel">
    <label>Content type
      <select id="type"></select>
    </label>
    <div id="content-form"></div>
    <div>
      <div class="row" style="align-items:center;margin-bottom:0.4rem">
        <strong>Presets</strong>
      </div>
      <div id="presets" class="row" style="flex-wrap:wrap"></div>
    </div>
    <fieldset>
      <legend>Style</legend>
      <div class="row">
        <label>Foreground <input type="color" id="fg" value="#000000"/></label>
        <label>Background <input type="color" id="bg" value="#ffffff"/></label>
        <label class="check"><input type="checkbox" id="bg-transparent"/> transparent</label>
      </div>
      <div class="row">
        <label>Gradient
          <select id="gradient"><option value="">none</option><option>linear</option><option>radial</option></select>
        </label>
        <label>To <input type="color" id="gradient-to" value="#42a5f5"/></label>
        <label>Angle <input type="number" id="gradient-angle" value="45" min="0" max="359"/></label>
      </div>
      <div class="row">
        <label>Shape
          <select id="shape"><option>square</option><option>rounded</option><option>dots</option><option>classy</option></select>
        </label>
        <label>Dot radius <input type="range" id="dot-radius" min="0.1" max="0.5" step="0.05" value="0.5"/></label>
        <label>Eye
          <select id="eye"><option>square</option><option>rounded</option><option>circle</option><option>leaf</option></select>
        </label>
        <label class="check" title="Pure-shape eyes without scanner-safety tabs; may not scan on strict readers">
          <input type="checkbox" id="eye-decorative"/> decorative
        </label>
      </div>
      <div class="row">
        <label>Eye color <input type="color" id="eye-color" value="#000000" disabled/></label>
        <label class="check"><input type="checkbox" id="eye-auto" checked/> auto</label>
        <label>ECC
          <select id="ecc"><option>quartile</option><option>low</option><option>medium</option><option>high</option></select>
        </label>
        <label>Margin <input type="number" id="margin" value="4" min="0" max="16"/></label>
      </div>
      <div class="row">
        <label>Logo <input type="file" id="logo" accept="image/png,image/jpeg"/></label>
        <button type="button" id="logo-clear" hidden>Clear logo</button>
        <label>Logo size <input type="range" id="logo-size" min="0.1" max="0.33" step="0.01" value="0.25"/></label>
      </div>
    </fieldset>
    <div id="warnings"></div>
  </section>
  <section id="preview">
    <div id="badges">
      <span id="scan-badge" title="Live check: the rendered code is decoded with a real QR reader — the same standard as the project's test suite"></span>
      <span id="info-badge"></span>
    </div>
    <div id="qr"></div>
    <div id="downloads">
      <label class="dl-group">Download
        <select id="dl-format" title="Output format">
          <option value="svg" selected>SVG</option>
          <option value="pdf">PDF</option>
          <option value="eps">EPS</option>
          <option value="png">PNG</option>
        </select>
      </label>
      <button type="button" id="dl-btn">Save file</button>
      <label class="dl-group">Copy
        <select id="copy-format" title="What to copy">
          <option value="svg" selected>SVG</option>
          <option value="png">PNG image</option>
          <option value="link" title="A permalink to this exact QR and style">Share link</option>
        </select>
      </label>
      <button type="button" id="copy-btn">Copy</button>
      <label class="check" title="PNG resolution: pixels per QR module (24 is crisp for screens)">
        px/module <input type="number" id="px-per-module" value="24" min="1" max="256" style="width:4.5rem"/>
      </label>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
