[workspace]
resolver = "2"
members = ["crates/qrkit", "crates/qrkit-cli", "crates/qrkit-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gregnazario/qrcode"
homepage = "https://gregnazario.github.io/qrcode/"
rust-version = "1.75"

[workspace.dependencies]
qrcodegen = "1.8"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"
zune-jpeg = "0.4"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"
insta = "1"
tiny-skia = "0.11"
rqrr = { version = "0.7", default-features = false }
lopdf = "0.35"
clap_complete = "4"
clap_mangen = "0.2"
